<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#603cba">
    <meta name="msapplication-TileColor" content="#603cba">
    <meta name="theme-color" content="#000000">
    <title>Our Squad is Top — Solar System</title>
    <meta property="og:title" content="Our Squad is Top"/>
    <meta property="og:description" content="A tour through our solar system"/>
    <meta property="og:url" content="https://oursquadis.top"/>
    <meta property="og:image" content="https://oursquadis.top/android-chrome-512x512.png"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        canvas { display: block; }

        #loading {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px;
            color: #fff; z-index: 200;
            background: #000;
            transition: opacity 0.8s ease;
        }
        #loading.fade { opacity: 0; pointer-events: none; }
        #loading-text { font-size: 1.1rem; letter-spacing: 0.15em; opacity: 0.7; }
        #loading-bar-wrap { width: 180px; height: 2px; background: rgba(255,255,255,0.15); border-radius: 1px; }
        #loading-bar { height: 100%; width: 0%; background: #fff; border-radius: 1px; transition: width 0.3s ease; }

        #ui {
            position: fixed; bottom: 24px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 100;
        }
        .btn {
            background: rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 7px 16px; border-radius: 20px;
            cursor: pointer; font-size: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.2s, color 0.2s;
            letter-spacing: 0.04em;
        }
        .btn:hover, .btn.active {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }

        #label {
            position: fixed; top: 20px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 11px; letter-spacing: 0.12em;
            text-transform: uppercase; z-index: 100;
            pointer-events: none;
        }

        #tooltip {
            position: fixed;
            background: rgba(0,0,0,0.7);
            color: rgba(255,255,255,0.9);
            padding: 5px 12px; border-radius: 10px;
            font-size: 12px; letter-spacing: 0.06em;
            pointer-events: none; opacity: 0;
            transition: opacity 0.15s;
            z-index: 200;
            border: 1px solid rgba(255,255,255,0.12);
        }
    </style>
</head>
<body>
    <div id="loading">
        <div id="loading-text">Our Squad is Top</div>
        <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    </div>

    <div id="label">Our Solar System</div>
    <div id="tooltip"></div>

    <div id="ui">
        <button class="btn active" id="btn-free">Free</button>
        <button class="btn" id="btn-top">Top</button>
        <button class="btn" id="btn-side">Side</button>
        <button class="btn" id="btn-speed">Speed ×1</button>
    </div>

    <!-- Import map — works in Safari 16.4+ (2023). Fallback below for older. -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ── Loading progress helper ──────────────────────────────────
        let loadProgress = 0;
        const bar = document.getElementById('loading-bar');
        function setProgress(p) {
            loadProgress = Math.max(loadProgress, p);
            bar.style.width = loadProgress + '%';
        }

        // ── Scene setup ──────────────────────────────────────────────
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 8000;

        camera.position.set(0, 300, 700);
        camera.lookAt(0, 0, 0);

        setProgress(10);

        // ── Texture loader ────────────────────────────────────────────
        const tl = new THREE.TextureLoader();
        let texLoaded = 0;
        const TEX_TOTAL = 11; // sun + 8 planets + moon + milkyway

        function tex(url) {
            return new Promise(resolve => {
                tl.load(url,
                    t => { texLoaded++; setProgress(10 + (texLoaded / TEX_TOTAL) * 70); resolve(t); },
                    undefined,
                    () => { texLoaded++; setProgress(10 + (texLoaded / TEX_TOTAL) * 70); resolve(null); }
                );
            });
        }

        // ── Load all textures in parallel ─────────────────────────────
        const [
            sunTex, mercTex, venusTex, earthTex, marsTex,
            jupTex, satTex, uraTex, nepTex, moonTex, milkyTex
        ] = await Promise.all([
            tex('2k_sun.jpg'), tex('2k_mercury.jpg'), tex('2k_venus_surface.jpg'),
            tex('2k_earth_daymap.jpg'), tex('2k_mars.jpg'), tex('2k_jupiter.jpg'),
            tex('2k_saturn.jpg'), tex('2k_uranus.jpg'), tex('2k_neptune.jpg'),
            tex('2k_moon.jpg'), tex('milkyway.jpg')
        ]);

        setProgress(80);

        // ── Milky Way ─────────────────────────────────────────────────
        if (milkyTex) {
            const bg = new THREE.Mesh(
                new THREE.SphereGeometry(50000, 64, 64),
                new THREE.MeshBasicMaterial({ map: milkyTex, side: THREE.BackSide })
            );
            bg.geometry.scale(-1, 1, 1);
            scene.add(bg);
        }

        // ── Lighting ──────────────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0x111111, 1));
        const sunLight = new THREE.PointLight(0xffffff, 3, 4000);
        scene.add(sunLight);

        // ── Sun ───────────────────────────────────────────────────────
        const SUN_R = 100;
        const sunMat = new THREE.MeshBasicMaterial({ map: sunTex || undefined, color: sunTex ? 0xffffff : 0xffcc00 });
        const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 64, 64), sunMat);
        scene.add(sun);

        // Sun corona glow (additive sprite)
        const sunGlowLight = new THREE.PointLight(0xffcc44, 1.5, 1500);
        scene.add(sunGlowLight);

        // ── Planet data ───────────────────────────────────────────────
        // [name, texture, radiusRatio vs Sun, semi-major axis AU, inclination°, hasRings]
        const DIST = 28; // AU → scene units multiplier
        const PLANETS = [
            ['Mercury', mercTex,  0.0035, 0.387, 7.0,  false],
            ['Venus',   venusTex, 0.0087, 0.723, 3.4,  false],
            ['Earth',   earthTex, 0.0091, 1.000, 0.0,  false],
            ['Mars',    marsTex,  0.0048, 1.524, 1.9,  false],
            ['Jupiter', jupTex,   0.1027, 5.203, 1.3,  false],
            ['Saturn',  satTex,   0.0866, 9.537, 2.5,  true ],
            ['Uranus',  uraTex,   0.0368,19.191, 0.8,  false],
            ['Neptune', nepTex,   0.0357,30.069, 1.8,  false],
        ];

        // Minimum visual radius so inner planets are actually visible
        const MIN_R = 3;

        function orbitLine(radius, incline) {
            const pts = [];
            for (let i = 0; i <= 256; i++) {
                const a = (i / 256) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
            }
            const line = new THREE.LineLoop(
                new THREE.BufferGeometry().setFromPoints(pts),
                new THREE.LineBasicMaterial({ color: 0x334455, transparent: true, opacity: 0.35 })
            );
            line.rotation.x = incline * Math.PI / 180;
            return line;
        }

        const bodies = [];
        const meshes = []; // for raycasting

        PLANETS.forEach(([name, texture, rRatio, au, inc, rings]) => {
            const orbitRadius = SUN_R + au * DIST * 10;
            const r = Math.max(SUN_R * rRatio * 0.6, MIN_R);
            // Kepler ω ∝ a^(-3/2), normalised so Earth ~ 1 cycle per loop
            const orbSpeed = 0.00025 / Math.pow(au, 1.5);

            // Orbit line
            scene.add(orbitLine(orbitRadius, inc));

            // Orbit group (handles inclination)
            const orbitGroup = new THREE.Group();
            orbitGroup.rotation.x = inc * Math.PI / 180;
            scene.add(orbitGroup);

            // Planet
            const mat = new THREE.MeshPhongMaterial({
                map: texture || undefined,
                color: texture ? 0xffffff : 0x888888,
                shininess: 12,
            });
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 48), mat);
            mesh.position.x = orbitRadius;
            mesh.userData.name = name;
            orbitGroup.add(mesh);
            meshes.push(mesh);

            // Saturn rings
            if (rings) {
                const rg = new THREE.RingGeometry(r * 1.35, r * 2.3, 128);
                // Fix RingGeometry UVs for proper texture mapping
                const pos = rg.attributes.position;
                const uv  = rg.attributes.uv;
                const v3  = new THREE.Vector3();
                for (let i = 0; i < pos.count; i++) {
                    v3.fromBufferAttribute(pos, i);
                    uv.setXY(i, v3.length() / (r * 2.3), 0);
                }
                const rm = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({
                    color: 0xc8b87a,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.72,
                }));
                rm.rotation.x = Math.PI / 2.4;
                mesh.add(rm);
            }

            // Earth: add Moon
            if (name === 'Earth') {
                const moonR = r * 0.27;
                const moonD = r * 5;
                const moonMesh = new THREE.Mesh(
                    new THREE.SphereGeometry(moonR, 32, 32),
                    new THREE.MeshPhongMaterial({ map: moonTex || undefined, color: moonTex ? 0xffffff : 0x888888, shininess: 5 })
                );
                moonMesh.position.x = moonD;
                moonMesh.userData.name = 'Moon';
                const moonOrbit = new THREE.Group();
                moonOrbit.add(moonMesh);
                mesh.add(moonOrbit);
                meshes.push(moonMesh);
                bodies.push({ mesh: moonMesh, orbitGroup: moonOrbit, orbitRadius: moonD, speed: 0.015, spin: 0.004, isMoon: true, angle: 0 });
            }

            bodies.push({ mesh, orbitGroup, orbitRadius, speed: orbSpeed, spin: 0.005, isMoon: false, angle: Math.random() * Math.PI * 2 });
        });

        setProgress(95);

        // ── Tooltip ───────────────────────────────────────────────────
        const tooltip = document.getElementById('tooltip');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-99, -99);

        renderer.domElement.addEventListener('mousemove', e => {
            mouse.x =  (e.clientX / innerWidth)  * 2 - 1;
            mouse.y = -(e.clientY / innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(meshes);
            if (hits.length) {
                tooltip.style.opacity = '1';
                tooltip.style.left = (e.clientX + 14) + 'px';
                tooltip.style.top  = (e.clientY - 10) + 'px';
                tooltip.textContent = hits[0].object.userData.name || '';
            } else {
                tooltip.style.opacity = '0';
            }
        });

        // ── Speed control ─────────────────────────────────────────────
        let speedMult = 1;
        const speeds = [1, 5, 25, 100];
        let speedIdx = 0;
        document.getElementById('btn-speed').addEventListener('click', function() {
            speedIdx = (speedIdx + 1) % speeds.length;
            speedMult = speeds[speedIdx];
            this.textContent = `Speed ×${speedMult}`;
        });

        // ── Camera presets ────────────────────────────────────────────
        function setActive(id) {
            ['btn-free','btn-top','btn-side'].forEach(b =>
                document.getElementById(b).classList.toggle('active', b === id));
        }
        document.getElementById('btn-top').addEventListener('click', () => {
            camera.position.set(0, 2200, 0); camera.lookAt(0,0,0); controls.update(); setActive('btn-top');
        });
        document.getElementById('btn-side').addEventListener('click', () => {
            camera.position.set(2200, 60, 0); camera.lookAt(0,0,0); controls.update(); setActive('btn-side');
        });
        document.getElementById('btn-free').addEventListener('click', () => {
            camera.position.set(0, 300, 700); camera.lookAt(0,0,0); controls.update(); setActive('btn-free');
        });

        // ── Loading complete ──────────────────────────────────────────
        setProgress(100);
        setTimeout(() => {
            const loading = document.getElementById('loading');
            loading.classList.add('fade');
            setTimeout(() => loading.remove(), 900);
        }, 400);

        // ── Animation ─────────────────────────────────────────────────
        let last = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - last) / 1000, 0.1) * speedMult;
            last = now;

            sun.rotation.y += 0.0008 * speedMult;

            bodies.forEach(b => {
                if (b.isMoon) {
                    b.orbitGroup.rotation.y += b.speed * dt * 60;
                } else {
                    b.angle += b.speed * dt * 60;
                    b.mesh.position.x = Math.cos(b.angle) * b.orbitRadius;
                    b.mesh.position.z = Math.sin(b.angle) * b.orbitRadius;
                }
                b.mesh.rotation.y += b.spin * dt * 60;
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ── Resize ───────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
