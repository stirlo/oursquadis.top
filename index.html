<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#603cba">
    <meta name="msapplication-TileColor" content="#603cba">
    <meta name="theme-color" content="#000000">
    <title>Our Squad is Top — Solar System</title>
    <meta property="og:title" content="Our Squad is Top"/>
    <meta property="og:description" content="A tour through our solar system"/>
    <meta property="og:url" content="https://oursquadis.top"/>
    <meta property="og:image" content="https://oursquadis.top/android-chrome-512x512.png"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
        canvas { display: block; }

        #ui {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
            -webkit-backdrop-filter: blur(8px);
        }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn.active { background: rgba(255,255,255,0.3); border-color: rgba(255,255,255,0.6); }

        #label {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            z-index: 100;
            pointer-events: none;
        }

        #tooltip {
            position: fixed;
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 200;
            border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <div id="label">Our Solar System</div>
    <div id="tooltip"></div>

    <div id="ui">
        <button class="btn active" id="btn-free">Free Camera</button>
        <button class="btn" id="btn-top">Top View</button>
        <button class="btn" id="btn-side">Side View</button>
        <button class="btn" id="btn-speed">Speed ×1</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script>
    (function() {
        // ── Scene setup ──────────────────────────────────────────────
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 5000;

        camera.position.set(0, 280, 600);
        camera.lookAt(0, 0, 0);

        // ── Texture loader ───────────────────────────────────────────
        const tl = new THREE.TextureLoader();
        const tex = (f) => tl.load(f);

        // ── Milky Way background ─────────────────────────────────────
        const bgGeo = new THREE.SphereGeometry(50000, 64, 64);
        bgGeo.scale(-1, 1, 1);
        scene.add(new THREE.Mesh(bgGeo, new THREE.MeshBasicMaterial({ map: tex('milkyway.jpg') })));

        // ── Lighting ─────────────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0x111111));
        const sunLight = new THREE.PointLight(0xffffff, 3, 3000);
        scene.add(sunLight);

        // ── Planet data ───────────────────────────────────────────────
        // Distances scaled logarithmically so all planets fit nicely on screen
        // Sizes scaled relative to Sun (Sun = 100 units)
        // Orbital speed uses Kepler's 3rd law: T² ∝ a³ → ω ∝ a^(-3/2)
        const SUN_R = 100;
        const DIST_SCALE = 22;   // spacing multiplier
        const SIZE_SCALE = 0.6;  // visual size exaggeration factor

        // [name, texFile, radiusRatio, orbitAU, inclination°, hasRings]
        const PLANETS = [
            ['Mercury', '2k_mercury.jpg',   0.0035, 0.387,  7.0,  false],
            ['Venus',   '2k_venus_surface.jpg', 0.0087, 0.723, 3.4, false],
            ['Earth',   '2k_earth_daymap.jpg',  0.0091, 1.000, 0.0, false],
            ['Mars',    '2k_mars.jpg',       0.0048, 1.524,  1.9, false],
            ['Jupiter', '2k_jupiter.jpg',    0.1027, 5.203,  1.3, false],
            ['Saturn',  '2k_saturn.jpg',     0.0866, 9.537,  2.5, true],
            ['Uranus',  '2k_uranus.jpg',     0.0368,19.191,  0.8, false],
            ['Neptune', '2k_neptune.jpg',    0.0357,30.069,  1.8, false],
        ];

        // ── Sun ───────────────────────────────────────────────────────
        const sunMat = new THREE.MeshBasicMaterial({ map: tex('2k_sun.jpg'), color: 0xffffff });
        const sun = new THREE.Mesh(new THREE.SphereGeometry(SUN_R, 64, 64), sunMat);
        scene.add(sun);

        // Sun glow sprite
        const sunGlow = new THREE.PointLight(0xffcc44, 2, 2000);
        scene.add(sunGlow);

        // ── Build planets ─────────────────────────────────────────────
        const bodies = []; // { mesh, orbitGroup, orbit, speed, name }

        function orbitLine(dist) {
            const pts = [];
            for (let i = 0; i <= 256; i++) {
                const a = (i / 256) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * dist, 0, Math.sin(a) * dist));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            const mat = new THREE.LineBasicMaterial({ color: 0x334455, transparent: true, opacity: 0.4 });
            return new THREE.LineLoop(geo, mat);
        }

        PLANETS.forEach(([name, texFile, radiusRatio, au, inc, rings]) => {
            const dist = SUN_R + au * DIST_SCALE * 10;
            // Planet radius — exaggerated so inner planets are visible
            const r = Math.max(SUN_R * radiusRatio * (1 / SIZE_SCALE), 2) * SIZE_SCALE;

            // Kepler: ω ∝ a^(-3/2), calibrated so Earth = 1 revolution
            const orbitalSpeed = 0.00025 / Math.pow(au, 1.5);
            const spinSpeed = 0.005;

            // Orbit group rotated to inclination
            const orbitGroup = new THREE.Group();
            orbitGroup.rotation.x = inc * Math.PI / 180;
            scene.add(orbitGroup);

            // Orbit line
            orbitGroup.add(orbitLine(dist));

            // Planet mesh
            const mat = new THREE.MeshPhongMaterial({
                map: tex(texFile),
                shininess: 15,
            });
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 48), mat);
            mesh.position.x = dist;
            mesh.userData.name = name;
            orbitGroup.add(mesh);

            // Saturn rings
            if (rings) {
                const ringGeo = new THREE.RingGeometry(r * 1.3, r * 2.2, 128);
                // Fix UV for RingGeometry so texture would apply radially
                const pos = ringGeo.attributes.position;
                const uv = ringGeo.attributes.uv;
                for (let i = 0; i < pos.count; i++) {
                    const v = new THREE.Vector3().fromBufferAttribute(pos, i);
                    uv.setXY(i, v.length() / (r * 2.2), 0);
                }
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xc8a96e,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.75,
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2.5;
                mesh.add(ringMesh);
            }

            // Earth's Moon
            if (name === 'Earth') {
                const moonR = r * 0.27;
                const moonDist = r * 4;
                const moonMat = new THREE.MeshPhongMaterial({ map: tex('2k_moon.jpg'), shininess: 5 });
                const moon = new THREE.Mesh(new THREE.SphereGeometry(moonR, 32, 32), moonMat);
                moon.position.x = moonDist;
                const moonOrbit = new THREE.Group();
                moonOrbit.add(moon);
                mesh.add(moonOrbit);
                bodies.push({ mesh: moon, orbitGroup: moonOrbit, orbitRadius: moonDist, speed: 0.013, spin: 0.003, name: 'Moon', isMoon: true });
            }

            bodies.push({ mesh, orbitGroup, orbitRadius: dist, speed: orbitalSpeed, spin: spinSpeed, name, angle: Math.random() * Math.PI * 2 });
        });

        // ── Tooltip ───────────────────────────────────────────────────
        const tooltip = document.getElementById('tooltip');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const allMeshes = bodies.map(b => b.mesh);

        renderer.domElement.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(allMeshes);
            if (hits.length) {
                tooltip.style.opacity = '1';
                tooltip.style.left = (e.clientX + 14) + 'px';
                tooltip.style.top = (e.clientY - 10) + 'px';
                tooltip.textContent = hits[0].object.userData.name || '';
            } else {
                tooltip.style.opacity = '0';
            }
        });

        // ── Speed control ─────────────────────────────────────────────
        let speedMult = 1;
        const speeds = [1, 5, 20, 100];
        let speedIdx = 0;
        document.getElementById('btn-speed').addEventListener('click', function() {
            speedIdx = (speedIdx + 1) % speeds.length;
            speedMult = speeds[speedIdx];
            this.textContent = `Speed ×${speedMult}`;
        });

        // ── Camera presets ────────────────────────────────────────────
        function setCameraBtn(id) {
            ['btn-free','btn-top','btn-side'].forEach(b => {
                document.getElementById(b).classList.toggle('active', b === id);
            });
        }

        document.getElementById('btn-top').addEventListener('click', () => {
            camera.position.set(0, 2000, 0);
            camera.lookAt(0, 0, 0);
            controls.update();
            setCameraBtn('btn-top');
        });
        document.getElementById('btn-side').addEventListener('click', () => {
            camera.position.set(2000, 80, 0);
            camera.lookAt(0, 0, 0);
            controls.update();
            setCameraBtn('btn-side');
        });
        document.getElementById('btn-free').addEventListener('click', () => {
            camera.position.set(0, 280, 600);
            camera.lookAt(0, 0, 0);
            controls.update();
            setCameraBtn('btn-free');
        });

        // ── Animation ─────────────────────────────────────────────────
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1) * speedMult;
            lastTime = now;

            sun.rotation.y += 0.001 * speedMult;

            bodies.forEach(b => {
                if (b.isMoon) {
                    b.orbitGroup.rotation.y += b.speed * dt * 60;
                } else {
                    b.angle = (b.angle || 0) + b.speed * dt * 60;
                    b.mesh.position.x = Math.cos(b.angle) * b.orbitRadius;
                    b.mesh.position.z = Math.sin(b.angle) * b.orbitRadius;
                }
                b.mesh.rotation.y += b.spin * dt * 60;
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ── Resize ───────────────────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

    })();
    </script>
</body>
</html>
