_Watch Halley's Comet race through our solar system in 80 seconds._

## What oursquadis.top does

Understanding the scale and motion of our solar system is difficult from Earth's perspective. Halley's Comet offers a rare vantage point, but its 76-year orbit means we rarely experience its full journey. This project compresses that voyage into a real-time 3D visualization so you can see what the comet sees as it travels through space. The visualization renders the sun, all major planets with accurate textures, and orbital paths using Three.js and WebGL. As you watch from Halley's Comet's perspective, cel-shaded artistic rendering brings the solar system to life with responsive design that works on any device. Imagine sitting on Halley's Comet, watching the planets wheel past you in their orbits, the sun's light painting the scene, and the entire 76-year journey unfolding before your eyes in just 80 seconds. No special software or setup required, the experience starts the moment you open the page in your browser.

