_See our solar system through the eyes of Halley's Comet in a real-time 3D visualization._

## What oursquadis.top does

Understanding orbital mechanics and celestial dynamics can feel abstract without a visual reference point. This project compresses Halley's 76-year orbit into an 80-second journey, making it possible to witness the comet's path through our solar system in real time. The visualization renders the sun, all major planets with accurate textures, and Halley's Comet's trajectory using Three.js and WebGL. You can interact with the scene through orbit controls while the simulation animates automatically when you open the page. Imagine watching the planets orbit around the sun while traveling alongside Halley's Comet, seeing the solar system from a perspective that's rarely visualized. The cel-shaded rendering creates an artistic yet scientifically grounded view, viewable on any modern browser including mobile devices.

